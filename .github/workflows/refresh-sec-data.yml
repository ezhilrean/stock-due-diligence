name: Refresh SEC EDGAR research data

on:
  workflow_dispatch:
  schedule:
    # Run every weekday at 12:20 UTC (20:20 Singapore time).
    - cron: "20 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: sec-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh public SEC data
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/refresh_sec_data.py

      - name: Commit updated static dataset
        run: |
          git add -f site/data/research.json
          if git diff --cached --quiet -- site/data/research.json; then
            echo "SEC dataset is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh SEC EDGAR research dataset"
          git push
